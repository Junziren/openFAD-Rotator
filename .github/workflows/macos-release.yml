name: macOS release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release when this workflow runs from a version tag
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  build-release:
    runs-on: macos-14

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WebUI/package-lock.json

      - name: Fetch pinned JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.12
          path: JUCE
          fetch-depth: 1

      - name: Build WebUI
        working-directory: WebUI
        run: |
          npm ci
          npm run validate:manifest
          npm run build

      - name: Configure CMake
        run: |
          cmake -S . -B build-macos -G Xcode \
            -DJUCE_PATH="$GITHUB_WORKSPACE/JUCE" \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DCMAKE_XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH=NO

      - name: Build AUv3, VST3, Standalone and tests
        run: |
          cmake --build build-macos --config Release --target \
            openFADRotator_All \
            openFADRotator_DSPTests \
            openFADRotator_DSPAllocationTests \
            openFADRotator_DSPPerformanceTests \
            openFADRotator_DSPSoakTests \
            openFADRotator_ProcessorTests \
            openFADRotator_ProcessorAllocationTests \
            openFADRotator_ProcessorPerformanceTests \
            openFADRotator_VST3HostSmoke

      - name: Run CTest
        run: ctest --test-dir build-macos -C Release --output-on-failure

      - name: Verify release bundle topology
        run: |
          set -euo pipefail
          root="build-macos/openFADRotator_artefacts/Release"
          vst3="$root/VST3/openFAD Rotator.vst3/Contents/MacOS/openFAD Rotator"
          standalone="$root/Standalone/openFAD Rotator.app/Contents/MacOS/openFAD Rotator"
          appex="$root/Standalone/openFAD Rotator.app/Contents/PlugIns/openFAD Rotator.appex/Contents/MacOS/openFAD Rotator"
          test -x "$vst3"
          test -x "$standalone"
          test -x "$appex"
          test -d "$root/AUv3/openFAD Rotator.appex"
          for binary in "$vst3" "$standalone" "$appex"; do
            arches="$(lipo -archs "$binary")"
            echo "$binary: $arches"
            [[ "$arches" == *arm64* ]]
            [[ "$arches" == *x86_64* ]]
          done

      - name: Package macOS distribution
        id: package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            version="$(sed -nE 's/.*project[[:space:]]*\([[:space:]]*openFADRotator[[:space:]]+VERSION[[:space:]]+([0-9]+(\.[0-9]+){1,3}).*/\1/p' CMakeLists.txt | head -n 1)"
          fi
          bash Scripts/package-macos-release.sh \
            --build-dir build-macos \
            --configuration Release \
            --output-dir build-macos/macos-release \
            --version "$version"
          cat > build-macos/macos-release/RELEASE-NOTES.md <<EOF
          # openFAD Rotator $version - macOS

          This release contains unsigned universal2 VST3 and Standalone/AUv3
          artifacts built on macOS 14 with JUCE 8.0.12. The package installs the
          VST3 bundle and the Standalone app; the AUv3 extension is embedded in
          that app. Signing, notarization, and DAW/device validation are not
          included in this development distribution.
          EOF
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openFAD-Rotator-macos-${{ steps.package.outputs.version }}
          if-no-files-found: error
          path: |
            build-macos/macos-release/*.pkg
            build-macos/macos-release/*.zip
            build-macos/macos-release/RELEASE-NOTES.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${{ steps.package.outputs.version }}"
          pkg="build-macos/macos-release/openFAD-Rotator-${version}-macOS-universal2.pkg"
          zip="build-macos/macos-release/openFAD-Rotator-${version}-macOS-universal2.zip"
          notes="build-macos/macos-release/RELEASE-NOTES.md"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$pkg" "$zip" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --title "openFAD Rotator $version" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$pkg" "$zip" \
              --title "openFAD Rotator $version" \
              --notes-file "$notes" \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi
